<svg width="640" height="400" viewBox="0 0 640 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Convert tool preview">
  <rect width="640" height="400" rx="14" fill="#15161c" stroke="#2a2b33"/>
  <rect width="640" height="44" rx="14" fill="#1b1c24"/>
  <rect y="30" width="640" height="14" fill="#1b1c24"/>
  <circle cx="26" cy="22" r="6" fill="#3a3b44"/>
  <circle cx="46" cy="22" r="6" fill="#3a3b44"/>
  <circle cx="66" cy="22" r="6" fill="#3a3b44"/>
  <text x="320" y="27" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#8A8C96">Convert — batch queue</text>

  <!-- target controls -->
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="32" y="84" font-size="13" fill="#6f717b">Target</text>
    <rect x="86" y="68" width="86" height="26" rx="13" fill="#2a241c"/><text x="129" y="85" text-anchor="middle" font-size="12" font-weight="700" fill="#E6A23C">MP3 320</text>
    <rect x="182" y="68" width="78" height="26" rx="13" fill="#1e1f28" stroke="#2f3039"/><text x="221" y="85" text-anchor="middle" font-size="12" fill="#8A8C96">AAC 256</text>
    <rect x="270" y="68" width="70" height="26" rx="13" fill="#1e1f28" stroke="#2f3039"/><text x="305" y="85" text-anchor="middle" font-size="12" fill="#8A8C96">WAV</text>
  </g>

  <!-- progress rows -->
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13">
    <text x="32" y="138" fill="#D8DAE2">Midnight Drive.aiff → mp3</text>
    <rect x="32" y="148" width="500" height="8" rx="4" fill="#23242c"/>
    <rect x="32" y="148" width="500" height="8" rx="4" fill="#5BC98A"/>
    <text x="556" y="156" fill="#5BC98A" font-weight="700">done</text>

    <text x="32" y="190" fill="#D8DAE2">Sunset Boulevard.wav → mp3</text>
    <rect x="32" y="200" width="500" height="8" rx="4" fill="#23242c"/>
    <rect x="32" y="200" width="362" height="8" rx="4" fill="#E6A23C"/>
    <text x="556" y="208" fill="#E6A23C" font-weight="700">72%</text>

    <text x="32" y="242" fill="#D8DAE2">Lost Frequencies.m4a → mp3</text>
    <rect x="32" y="252" width="500" height="8" rx="4" fill="#23242c"/>
    <rect x="32" y="252" width="145" height="8" rx="4" fill="#E6A23C"/>
    <text x="556" y="260" fill="#E6A23C" font-weight="700">29%</text>

    <text x="32" y="294" fill="#8A8C96">Deep Cut.wav → mp3</text>
    <rect x="32" y="304" width="500" height="8" rx="4" fill="#23242c"/>
    <text x="552" y="312" fill="#6f717b" text-anchor="end">queued</text>

    <text x="32" y="346" fill="#8A8C96">Afterhours.flac → mp3</text>
    <rect x="32" y="356" width="500" height="8" rx="4" fill="#23242c"/>
    <text x="552" y="364" fill="#6f717b" text-anchor="end">queued</text>
  </g>

  <text x="32" y="392" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#6f717b" opacity="0">.</text>
</svg>
