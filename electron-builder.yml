appId: com.theosantos.cratekeeper
productName: CrateKeeper

directories:
  buildResources: build
  output: dist

files:
  - out/**/*
  - "!**/.DS_Store"

asarUnpack:
  - node_modules/ffmpeg-static/**
  - "**/*.node"

mac:
  icon: build/icon.icns
  entitlementsInherit: build/entitlements.mac.plist
  identity: null
  hardenedRuntime: false
  # better-sqlite3 ships a byte-identical test fixture (test_extension.node) that
  # @electron/universal refuses to merge unless declared here. It is never loaded
  # at runtime; take the x64 copy. The real better_sqlite3.node differs per-arch
  # and still lipo-merges to a fat binary.
  x64ArchFiles: "**/test_extension.node"
  target:
    - target: dmg
      arch: universal

dmg:
  sign: false
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: false
  perMachine: false
  artifactName: ${productName}-Setup-${version}.${ext}

publish:
  provider: github
  owner: Theosantos
  repo: CrateKeeper
  releaseType: release
